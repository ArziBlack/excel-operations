[package]
name = "xcel_operations"
version = "0.1.0"
edition = "2024"

[dependencies]
calamine = "0.23.1"  # For reading Excel files
rust_xlsxwriter = "0.62.0"  # For writing Excel files
chrono = { version = "0.4.34", features = ["serde"] }  # For date and time handling
reqwest = { version = "0.11", features = ["json"] }  # For HTTP requests
serde = { version = "1.0", features = ["derive"] }  # For JSON serialization
serde_json = "1.0"  # For JSON handling
tokio = { version = "1.0", features = ["full"] }  # For async runtime
dotenv = "0.15"  # For loading environment variables from .env file

[lib]
name = "xcel_operations"
path = "src/lib.rs"

[[bin]]
name = "xcel_operations"
path = "src/main.rs"

[[bin]]
name = "spill_example"
path = "src/bin/spill_example.rs"
